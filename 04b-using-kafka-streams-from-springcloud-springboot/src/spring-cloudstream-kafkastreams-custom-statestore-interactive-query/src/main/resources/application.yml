server:
  port: 8081

spring:
  application:
    name: "spring-boot-kafkastreams"

  cloud:
    function.definition: collect;enrich

    stream:
      bindings:
        collect-in-0:
          destination: test-kstream-spring-cloudstream-input-topic
        collect-out-0:
          destination: test-kstream-spring-cloudstream-output-topic
        enrich-in-0:
          destination: test-kstream-spring-cloudstream-input-enrich-topic
        enrich-in-1:
          destination: test-kstream-spring-cloudstream-output-topic
        enrich-out-0:
          destination: test-kstream-spring-cloudstream-output-enrich-topic

      kafka:
        streams.binder:
          applicationId: spring-boot-springcloud-kafkastreams
          functions:
            collect.applicationId: spring-boot-springcloud-kafkastreams-collect
            enrich.applicationId: spring-boot-springcloud-kafkastreams-enrich
          stateStoreRetry:
            maxAttempts: 10
            backOffInterval: 1000

          configuration:
            commit.interval.ms: 100
            cache.max.bytes.buffering: 0
            default.key.serde: org.apache.kafka.common.serialization.Serdes$VoidSerde
            default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
            application.server: localhost:8081

  kafka:
    bootstrap-servers: dataplatform:9092

  main.allow-circular-references: true

logging:
  level:
    root: info
    com.trivadis.kafkws.springboot.kafkastreamsspringcloudstream: debug

management:
  endpoint:
    health.show-details: ALWAYS

  endpoints:
    web:
      exposure:
        include: metrics, kafkastreamstopology